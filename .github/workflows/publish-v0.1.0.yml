name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.1.0.yml"

permissions:
  contents: write

concurrency:
  group: publish-golden-pompano-export-simulator-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install pinned build tools and package
        run: |
          python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify package version
        run: |
          test "$(python - <<'PY'
          from golden_pompano_export_simulator import __version__
          print(__version__)
          PY
          )" = "0.1.0"

      - name: Re-run complete release gates
        run: |
          python -m compileall -q src scripts tests
          python scripts/verify_test_count.py
          python -m unittest discover -s tests -v
          gpes validate examples/synthetic_baseline/scenario.json --public-fixture
          gpes validate examples/synthetic_resilient/scenario.json --public-fixture
          rm -rf release-run
          gpes simulate examples/synthetic_baseline/scenario.json \
            --output-dir release-run \
            --fixed-time 2026-08-31T00:00:00Z
          gpes verify release-run
          python scripts/compare_outputs.py examples/synthetic_baseline/output release-run
          python scripts/red_team.py release-run --output release-red-team.json
          python scripts/public_audit.py .
          python scripts/check_markdown_links.py .
          python scripts/verify_demo.py release-run

      - name: Create or verify immutable tag
        env:
          TAG: v0.1.0
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" || {
              echo "existing tag $TAG points to a different commit" >&2
              exit 1
            }
          else
            git config user.name "JINGJAYHUANG"
            git config user.email "201726583+JINGJAYHUANG@users.noreply.github.com"
            git tag -a "$TAG" -m "Golden Pompano Export Simulator $TAG"
            git push origin "$TAG"
          fi

      - name: Build deterministic release assets
        env:
          SOURCE_DATE_EPOCH: "1788134400"
        run: |
          rm -rf dist-release
          mkdir -p dist-release
          python -m pip wheel --no-deps --no-build-isolation . -w dist-release
          cp examples/scenario-comparison.json dist-release/SCENARIO_COMPARISON.json
          cp examples/red-team-results.json dist-release/RED_TEAM_RESULTS.json
          cp examples/synthetic_baseline/output/summary.json dist-release/SYNTHETIC_BASELINE_SUMMARY.json
          python scripts/build_release.py --version 0.1.0 --output-dir dist-release
          sha256sum -c dist-release/SHA256SUMS.txt

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "release v0.1.0 already exists; refusing to replace assets" >&2
            exit 1
          fi
          gh release create v0.1.0 dist-release/* \
            --title "Golden Pompano Export Simulator v0.1.0" \
            --notes "Public alpha with explicit fish/glaze/packaging mass bases, seller and buyer economic bridges, working-capital and profit-sharing models, quote targets, deterministic sensitivity, synthetic fixtures, 523 tests and nine integrity attacks. All market, legal, customs, tax, quality, logistics and payment assumptions require independent verification."
