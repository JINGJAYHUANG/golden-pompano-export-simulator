name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic version tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release

    steps:
      - name: Resolve release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid semantic release tag: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points at current checkout
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/golden_pompano_export_simulator/__init__.py').read_text()
          print(re.search(r'__version__ = "([^"]+)"', text).group(1))
          PY
          )" = "${TAG#v}"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install pinned build tools and package
        run: |
          python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Re-run release gates
        run: |
          python -m compileall -q src scripts tests
          python scripts/verify_test_count.py
          python -m unittest discover -s tests -v
          gpes validate examples/synthetic_baseline/scenario.json --public-fixture
          gpes validate examples/synthetic_resilient/scenario.json --public-fixture
          rm -rf release-run
          gpes simulate examples/synthetic_baseline/scenario.json \
            --output-dir release-run \
            --fixed-time 2026-08-31T00:00:00Z
          gpes verify release-run
          python scripts/compare_outputs.py examples/synthetic_baseline/output release-run
          python scripts/red_team.py release-run --output release-red-team.json
          python scripts/public_audit.py .
          python scripts/check_markdown_links.py .

      - name: Build release assets
        env:
          SOURCE_DATE_EPOCH: "1788134400"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf dist-release
          mkdir -p dist-release
          python -m pip wheel --no-deps --no-build-isolation . -w dist-release
          cp examples/scenario-comparison.json dist-release/SCENARIO_COMPARISON.json
          cp examples/red-team-results.json dist-release/RED_TEAM_RESULTS.json
          cp examples/synthetic_baseline/output/summary.json dist-release/SYNTHETIC_BASELINE_SUMMARY.json
          python scripts/build_release.py --version "$VERSION" --output-dir dist-release
          sha256sum -c dist-release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" dist-release/* \
            --title "Golden Pompano Export Simulator $TAG" \
            --notes "Public alpha $VERSION. Provides deterministic mass-balance, seller profit, buyer landed-cost, working-capital, profit-sharing, quote-target and sensitivity modelling using synthetic fixtures. All legal, tax, customs, product and market assumptions require independent verification."
