<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Golden Pompano Export Simulator architecture</title>
<desc id="desc">A flow from explicit assumptions through mass balance, seller economics, buyer landed cost, sensitivity and an auditable output bundle.</desc>
<rect width="1200" height="630" fill="#f4f0e6"/>
<text x="60" y="74" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17211b">Golden Pompano Export Simulator</text>
<text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#5f695f">Explicit mass bases · two-sided economics · deterministic evidence</text>
<g font-family="Arial,sans-serif" font-size="17" fill="#17211b">
  <rect x="60" y="160" width="190" height="92" rx="14" fill="#fffdf7" stroke="#1f6b55" stroke-width="2"/>
  <text x="155" y="194" text-anchor="middle" font-weight="700">Scenario JSON</text><text x="155" y="222" text-anchor="middle" font-size="14">units · dates · FX · terms</text>
  <path d="M250 206 H300" stroke="#1f6b55" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="300" y="160" width="190" height="92" rx="14" fill="#fffdf7" stroke="#1f6b55" stroke-width="2"/>
  <text x="395" y="194" text-anchor="middle" font-weight="700">Mass engine</text><text x="395" y="222" text-anchor="middle" font-size="14">fish · glaze · tare · load</text>
  <path d="M490 206 H540" stroke="#1f6b55" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="540" y="160" width="190" height="92" rx="14" fill="#fffdf7" stroke="#1f6b55" stroke-width="2"/>
  <text x="635" y="194" text-anchor="middle" font-weight="700">Responsibility</text><text x="635" y="222" text-anchor="middle" font-size="14">editable cost allocation</text>
  <path d="M730 206 H780" stroke="#1f6b55" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="780" y="130" width="360" height="152" rx="14" fill="#e6f2ec" stroke="#1f6b55" stroke-width="2"/>
  <text x="960" y="174" text-anchor="middle" font-weight="700">Two-sided economics</text>
  <text x="960" y="207" text-anchor="middle" font-size="14">Seller: profit · financing · share</text>
  <text x="960" y="235" text-anchor="middle" font-size="14">Buyer: cash landed · economic landed</text>
  <rect x="145" y="350" width="260" height="108" rx="14" fill="#fffdf7" stroke="#9a5d1d" stroke-width="2"/>
  <text x="275" y="386" text-anchor="middle" font-weight="700">Quote targets</text><text x="275" y="416" text-anchor="middle" font-size="14">break-even · target margin</text>
  <rect x="470" y="350" width="260" height="108" rx="14" fill="#fffdf7" stroke="#9a5d1d" stroke-width="2"/>
  <text x="600" y="386" text-anchor="middle" font-weight="700">Sensitivity</text><text x="600" y="416" text-anchor="middle" font-size="14">one-way · two-way grid</text>
  <rect x="795" y="350" width="260" height="108" rx="14" fill="#fffdf7" stroke="#9a5d1d" stroke-width="2"/>
  <text x="925" y="386" text-anchor="middle" font-weight="700">Audit bundle</text><text x="925" y="416" text-anchor="middle" font-size="14">SQLite · hashes · event chain</text>
  <path d="M960 282 V318 H275 V350" fill="none" stroke="#9a5d1d" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M960 282 V318 H600 V350" fill="none" stroke="#9a5d1d" stroke-width="3" marker-end="url(#arrow2)"/>
  <path d="M960 282 V350" fill="none" stroke="#9a5d1d" stroke-width="3" marker-end="url(#arrow2)"/>
</g>
<rect x="60" y="520" width="1080" height="62" rx="12" fill="#17211b"/>
<text x="600" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fffdf7">A calculation is not a live quote, legal conclusion, customs classification or profit guarantee.</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f6b55"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9a5d1d"/></marker></defs>
</svg>
